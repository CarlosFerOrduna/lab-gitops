apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# The namespace itself is declared in namespaces/producer-b/ and applied first.
namespace: producer-b

labels:
  - pairs:
      app.kubernetes.io/part-of: producer-b

resources:
  - producer-b-config.configmap.yaml
  - producer-b-db.sealedsecret.yaml
  - producer-b-postgres.service.yaml
  - producer-b-postgres.statefulset.yaml
  - valkey-queue-auth.sealedsecret.yaml
  - valkey-queue.configmap.yaml
  - valkey-queue.service.yaml
  - valkey-queue.statefulset.yaml
  - valkey-cache-auth.sealedsecret.yaml
  - valkey-cache.configmap.yaml
  - valkey-cache.service.yaml
  - valkey-cache.deployment.yaml
  - producer-b.deployment.yaml
  - producer-b.service.yaml
  - producer-b-worker.deployment.yaml
  - kafka-client.certificate.yaml
  - lab-root-ca-ref.certificate.yaml

# The tag is the tree hash of the lab-producer-b commit the image was built from
# (git rev-parse HEAD^{tree}). CI updates it here in the CI stage.
images:
  - name: ghcr.io/carlosferorduna/lab-producer-b
    newTag: e8a5f866d100186fbdd1089786ef7999fdb82e98
