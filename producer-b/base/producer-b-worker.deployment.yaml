apiVersion: apps/v1
kind: Deployment
metadata:
  name: producer-b-worker
  labels:
    app.kubernetes.io/name: producer-b-worker
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: producer-b-worker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: producer-b-worker
    spec:
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        runAsNonRoot: true
      # On SIGTERM the worker finishes its jobs in progress (worker.close()) before exiting.
      terminationGracePeriodSeconds: 30
      containers:
        - name: worker
          image: ghcr.io/carlosferorduna/lab-producer-b
          command: ["node", "dist/worker.js"]
          ports:
            - name: http
              containerPort: 3000
          envFrom:
            - configMapRef:
                name: producer-b-config
          env:
            - name: QUEUE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: valkey-queue-auth
                  key: password
          # No Service and no readiness: the worker takes no traffic. With the processor down
          # it keeps retrying, so liveness only checks that the process answers.
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 256Mi
