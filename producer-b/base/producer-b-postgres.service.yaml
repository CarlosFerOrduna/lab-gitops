# Headless: the DNS name resolves straight to the pod of the StatefulSet.
apiVersion: v1
kind: Service
metadata:
  name: producer-b-postgres
  labels:
    app.kubernetes.io/name: producer-b-postgres
spec:
  clusterIP: None
  selector:
    app.kubernetes.io/name: producer-b-postgres
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
