apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# The namespace itself is declared in namespaces/producer-a/ and applied first.
namespace: producer-a

labels:
  - pairs:
      app.kubernetes.io/part-of: producer-a

resources:
  - producer-a-config.configmap.yaml
  - valkey-queue-auth.sealedsecret.yaml
  - valkey-queue.configmap.yaml
  - valkey-queue.service.yaml
  - valkey-queue.statefulset.yaml
  - producer-a.deployment.yaml
  - producer-a.service.yaml
  - producer-a-worker-config.configmap.yaml
  - producer-a-worker.deployment.yaml
  - kafka-client.certificate.yaml
  - lab-root-ca-ref.certificate.yaml

# The tag is the tree hash of the lab-producer-a commit the image was built from
# (git rev-parse HEAD^{tree}). CI updates it here in the CI stage.
images:
  - name: ghcr.io/carlosferorduna/lab-producer-a
    newTag: bf57e9204939b153482e9332d721f9485e170895
