# producer-b's identity in Kafka: the CN of the client certificate it requests in
# its own namespace (tls-external: the User Operator only manages the ACLs).
apiVersion: kafka.strimzi.io/v1
kind: KafkaUser
metadata:
  name: producer-b
  labels:
    strimzi.io/cluster: events
spec:
  authentication:
    type: tls-external
  authorization:
    type: simple
    acls:
      # Writes only to its own topics.
      - resource:
          type: topic
          name: producer-b.
          patternType: prefix
        operations:
          - Write
          - Describe
