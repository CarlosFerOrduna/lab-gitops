apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# The lab's own certificate authority. Apply after system/cert-manager/base,
# once its webhook is ready: these resources need its CRDs and webhook.
resources:
  - lab-selfsigned.clusterissuer.yaml
  - lab-root-ca.certificate.yaml
  - lab-ca.clusterissuer.yaml
  - kafka-clients-ca.certificate.yaml
  - kafka-clients-ca.clusterissuer.yaml
